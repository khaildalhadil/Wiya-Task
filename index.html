<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Create Account</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <main class="card">
    <h1>Create Account</h1>
    <p class="subtitle">All fields are required.</p>

    <form id="register-form" novalidate>
      <div class="field">
        <label for="fullName">Full Name</label>
        <input id="fullName" name="fullName" type="text" autocomplete="name"
               placeholder="Jane Doe" required aria-describedby="fullName-error">
        <p class="error" id="fullName-error"></p>
      </div>

      <div class="field">
        <label for="email">Email Address</label>
        <input id="email" name="email" type="email" autocomplete="email"
               placeholder="you@example.com" required aria-describedby="email-error">
        <p class="error" id="email-error"></p>
      </div>

      <div class="field">
        <label for="phone">Phone Number</label>
        <input id="phone" name="phone" type="tel" autocomplete="tel"
               placeholder="+966 5X XXX XXXX" required aria-describedby="phone-error">
        <p class="error" id="phone-error"></p>
      </div>

      <div class="field">
        <label for="password">Password</label>
        <input id="password" name="password" type="password" autocomplete="new-password"
               required aria-describedby="password-hint password-error">
        <p class="hint" id="password-hint">At least 8 characters, with letters and numbers.</p>
        <p class="error" id="password-error"></p>
      </div>

      <div class="field">
        <label for="confirmPassword">Confirm Password</label>
        <input id="confirmPassword" name="confirmPassword" type="password" autocomplete="new-password"
               required aria-describedby="confirmPassword-error">
        <p class="error" id="confirmPassword-error"></p>
      </div>

      <div class="field">
        <label class="checkbox">
          <input id="terms" name="terms" type="checkbox" required aria-describedby="terms-error">
          <span>I agree to the Terms &amp; Conditions</span>
        </label>
        <p class="error" id="terms-error"></p>
      </div>

      <button type="submit">Create Account</button>
    </form>
  </main>
</body>
</html>
